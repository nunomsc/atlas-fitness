   }

let records=[],active='',filter='',query='',storageError='',draft=null,editingId=null,toastTimeout,importMode='file',view='workout',evolutionExercise='',evolutionPeriod='all',evolutionMetric='',localSuggestion=null;const timers=new Map();

function renderSuggestion(){const analysis=localTrainingAnalysis(),p=localSuggestion?localSuggestion._atlas_sugestao_local.params:{goal:'equilibrio',duration:'45',equipment:'all',intensity:'moderada',focus:'auto',avoid:''},rec=FOCUS_LABEL[analysis.recommended];$('#content').innerHTML=`<div class="suggestion-hero"><section class="panel suggestion-copy"><span class="tag cyan">Motor local · sem Internet</span><h1>Sugerir o próximo treino</h1><p>O Atlas usa apenas o histórico guardado neste dispositivo para propor uma sessão. Podes ajustar todos os campos e editar o resultado antes de o guardar.</p></section><aside class="panel suggestion-insight"><span class="eyebrow">Leitura do histórico</span><strong>${esc(rec)}</strong><p class="small muted">${analysis.recent.length?`Sugestão baseada nos últimos ${analysis.recent.length} treinos datados.`:'Começa com uma sessão equilibrada; as recomendações melhoram com o histórico.'}</p></aside></div><form id="suggestion-form" class="panel suggestion-form"><div class="formgrid"><label>Objetivo<select name="goal"><option value="equilibrio" ${p.goal==='equilibrio'?'selected':''}>Equilíbrio semanal</option><option value="forca" ${p.goal==='forca'?'selected':''}>Força</option><option value="resistencia" ${p.goal==='resistencia'?'selected':''}>Resistência muscular</option><option value="perda" ${p.goal==='perda'?'selected':''}>Condicionamento / perda de peso</option></select></label><label>Duração<select name="duration"><option value="30" ${String(p.duration)==='30'?'selected':''}>30 minutos</option><option value="45" ${String(p.duration)==='45'?'selected':''}>45 minutos</option><option value="60" ${String(p.duration)==='60'?'selected':''}>60 minutos</option></select></label><label>Equipamento<select name="equipment"><option value="all" ${p.equipment==='all'?'selected':''}>Todo o equipamento</option><option value="gym" ${p.equipment==='gym'?'selected':''}>Ginásio / máquinas</option><option value="dumbbells" ${p.equipment==='dumbbells'?' function render(){renderHistory();const section=view==='evolution'?'Evolução':view==='suggestion'?'Sugestão local':'Diário';$('#current-section').textContent=section;document.querySelector('.evolution-link')?.classList.toggle('active',view==='evolution');document.querySelector('.suggestion-link')?.classList.toggle('active',view==='suggestion');if(view==='evolution')return renderEvolution();if(view==='suggestion')return renderSuggestion();return renderWorkout();}
function renderWorkout(){const r=current();if(!r){$('#content').innerHTML=`<div class="empty"><h1>O próximo treino começa aqui.</h1><p>Cria uma sessão ou importa o teu plano em JSON.</p><div class="row wrap" style="justify-content:center"><button class="primary" data-action="new">＋ Criar treino</button><button data-action="import">Importar JSON</button></div></div>`;return;}const t=r.treino,m=Core.metrics(t),d=Core.duration(t),bs=Core.blocks(t),done=Core.leaves(t).filter(e=>r.done[pathKey(e.path)]).length,pct=m.count?Math.round(done/m.count*100):0;$('#content').innerHTML=`<div class="headline row between"><div><div class="row wrap"><span class="tag">${esc(Core.category(t))}</span><span class="date">${icon('calendar')} ${esc(dateText(t.data))}</span>${r.demo?'<span class="small muted">Treino de exemplo</span>':''}</div><h1>${esc(Core.title(t))}</h1><p>${esc(t.objetivo||'O teu plano, exercício a exercício.')}</p></div><div class="row workout-actions"><button class="ghost" data-action="print-pdf" title="Criar PDF do plano"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 2h9l3 3v5H6V2Z"/><path d="M15 2v4h4M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M6 15h12v7H6z"/></svg> Criar PDF</button><button class="ghost" data-action="edit">${icon('edit')} Editar</button><button class="ghost icon" data-action="export" aria-label="Exportar treinos" title="Exportar JSON">↧</button><button class="ghost icon danger" data-action="delete" aria-label="Eliminar treino" title="Eliminar treino">×</button></div></div><div class="stats"><div class="stat"><div class="statlabel">${icon('clock')} Duração</div><div class="value">${d.value===null?'—':fmt(d.value)} <span class="unit">min</span></div><div class="small">${d.estimated?'Soma dos tempos indicados':'Duração planeada'}</div></div><div class="stat"><div class="statlabel">${icon('weight')} Volume de carga</div><div class="value">${m.loaded?fmt(m.volume):'—'} <span class="unit">kg</span></div> function modal(title,body){const el=$('#modal');el.innerHTML=`<header class="modal-head row between"><h2 id="modal-title">${title}</h2><button class="icon ghost" data-action="close" aria-label="Fechar">×</button></header><div class="modal-body">${body}</div>`;if(!el.open)el.showModal();}function closeModal(){$('#modal').close();draft=null;}

function addImported(ts){const added=ts.map(t=>({id:uid(),treino:t,done:{}}));records.push(...added);active=added[0].id;persist();closeModal();render();notify(`${added.length} ${added.length===1?'treino importado':'treinos importados'}.`);}
async function readFiles(files){try{const result=[];for(const f of files){if(!f.name.toLowerCase().endsWith('.json'))throw Error('Escolhe ficheiros com extensão .json.');if(f.size>5*1024*1024)throw Error('O ficheiro excede o limite de 5 MB.');result.push(...Core.parse(await f.text()));}if(result.length)addImported(result);}catch(e){$('#import-error').textContent=e.message;}}
function download(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}

function structuredSeriesEditor(x,p){if(!Array.isArray(x.series))return field('Séries',[...p,'series'],x.series,'number');return `<div class="structured-series full"><div class="row between"><strong class="small">Séries programadas</strong><button type="button" ${attrs('add-set',[...p,'series'])}>＋ Série</button></div>${x.series.map((set,i)=>`<div class="set-edit"><span class="set-index">${esc(set.serie??i+1)}</span>${field('Série',[...p,'series',i,'serie'],set.serie??i+1,'number')}${field('Repetições',[...p,'series',i,'repeticoes'],set.repeticoes,'number')}${field('Carga total (kg)',[...p,'series',i,'carga_kg'],set.carga_kg,'number')}${field('Carga por halter (kg)',[...p,'series',i,'carga_kg_por_halter'],set.carga_kg_por_halter,'number')}<button type="button" class="danger icon set-delete" ${attrs('remove-set',[...p,'series',i])} aria-label="Remover série ${esc(set.serie??i+1)}">×</button></div>`).join('')}</div>`;}

function editor(){const t=draft;modal(editingId?'Editar treino':'Novo treino',`<form id="workout-form"><div class="formgrid">${field('Foco / nome do treino',[t.foco!==undefined?'foco':t.tipo!==undefined?'tipo':'foco'],Core.title(t)==='Treino sem título'?'':Core.title(t),'text','required')}${field('Data',['data'],t.data,'date')}${field('Duração total (min)',['duracao_total_minutos'],t.duracao_total_minutos,'number')}<label>Categoria<select data-field='["categoria"]'>${['Força','Metabólico','Misto','Cardio'].map(x=>`<option ${Core.category(t)===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="full">${field('Objetivo',['objetivo'],t.objetivo)}</div>${textarea('Notas do treino',['notas'],t.notas)}</div><section class="editblock"><div class="row between"><h3>Aquecimento</h3>${!t.aquecimento?'<button type="button" data-action="add-warmup">＋ Adicionar</button>':''}</div>${Array.isArray(t.aquecimento)?t.aquecimento.map((x,i)=>exerciseEditor(x,['aquecimento',i])).join('')+'<button type="button" style="margin-top:12px" data-action="add-warmup">＋ Exercício de aquecimento</button>':t.aquecimento&&typeof t.aquecimento==='object'?textarea('Detalhes',['aquecimento','detalhes'],t.aquecimento.detalhes):typeof t.aquecimento==='string'?textarea('Detalhes',['aquecimento'],t.aquecimento):''}</section>${Core.blocks(t).map((b,i)=>{const x=b.data,p=b.path;return `<section class="editblock"><div class="row between"><h3>Bloco ${i+1}</h3><button type="button" class="danger icon" ${attrs('remove-block',p)}>Remover bloco</button></div>${p[0]==='exercicios'?'<p class="note">Lista principal de exercícios</p>':`<div class="formgrid" style="margin-top:12px">${field('Tipo (Força, AMRAP…)',[...p,'tipo'],x.tipo)}${field('Duração (min)',[...p,'duracao_minutos'],x.duracao_minutos,'number')}${field('Rondas completadas',[...p,'rondas_completadas'],x.rondas_completadas,'number')}${textarea('Notas do bloco',[...p,'notas'],x.notas)}</div>`}${Core.array(x.exercicios).map((e,j)=>exerciseEditor(e,[...p,...(p[0]==='exercicios'?[]:['exercicios']),j])).join('')}<div class="row wrap" style="margin-top:15px"><button type="button" ${attrs('add-ex',[...p,...(p[0]==='exercicios'?[]:['exercicios'])])}>＋ Exercício</button><button type="button" ${attrs('add-super',[...p,...(p[0]==='exercicios'?[]:['exercicios'])])}>＋ Superset</button></div></section>`;}).join('')}<button type="button" style="margin-top:18px" data-action="add-block">＋ Adicionar bloco</button><section class="editblock"><div class="row between"><h3>Cardio / Finisher</h3><button type="button" data-action="${t.cardio_final?'remove-cardio':'add-cardio'}">${t.cardio_final?'Remover':'＋ Adicionar'}</button></div>${t.cardio_final?`<div class="formgrid" style="margin-top:12px">${field('Modalidade',['cardio_final','tipo'],t.cardio_final.tipo)}${field('Tempo total (min)',['cardio_final','tempo_total_minutos'],t.cardio_final.tempo_total_minutos,'number')}</div>${Core.array(t.cardio_final.etapas).map((s,i)=>`<div class="editexercise">${field('Duração (min)',['cardio_final','etapas',i,'duracao_minutos'],s.duracao_minutos,'number')}${field('Velocidade (km/h)',['cardio_final','etapas',i,'velocidade_kmh'],s.velocidade_kmh,'number')}${field('Inclinação (%)',['cardio_final','etapas',i,'inclinacao'],s.inclinacao,'number')}<button type="button" ${attrs('remove-ex',['cardio_final','etapas',i])}>Remover</button></div>`).join('')}<button type="button" data-action="add-stage" style="margin-top:12px">＋ Etapa</button>`:''}</section><p class="note">Campos adicionais do JSON original são preservados ao editar. Guardar reinicia as marcações de exercícios e o temporizador desta sessão.</p><div id="edit-error" class="error" role="alert"></div><div class="modal-foot"><button type="button" data-action="close">Cancelar</button><button type="submit" class="primary">Guardar treino</button></div></form>`);}
function syncDraft(){if(!draft)return;$('#workout-form')?.querySelectorAll('[data-field]').forEach(el=>{const p=JSON.parse(el.dataset.field);if(el.value===''){const parent=getAt(draft,p.slice(0,-1));if(parent)delete parent[p.at(-1)];}else setAt(draft,p,el.type==='number'?Number(el.value):el.value);});}
function startEditor(id){editingId=id||null;draft=id?clone(current().treino):{data:new Date().toLocaleDateString('sv-SE'),foco:'',categoria:'Força',blocos_principais:[{tipo:'Força',exercicios:[{nome:'',series:3,repeticoes:10}]}]};editor();}
function editAction(a,p){syncDraft();if(a==='add-block'){draft.blocos_principais??=[];draft.blocos_principais.push({tipo:'Força',exercicios:[]});}if(a==='add-ex'||a==='add-super'){if(!getAt(draft,p))setAt(draft,p,[]);getAt(draft,p).push(a==='add-super'?{tipo_execucao:'Superset',rondas:3,descanso_apos_ronda_segundos:60,exercicios:[{nome:'',repeticoes:12}]}:{nome:'',series:3,repeticoes:10});}if(a==='remove-ex'){getAt(draft,p.slice(0,-1)).splice(p.at(-1),1);}if(a==='remove-block'){if(p[0]==='blocos_principais')draft.blocos_principais.splice(p[1],1);else delete draft[p[0]];}if(a==='add-warmup'){draft.aquecimento??=[];if(Array.isArray(draft.aquecimento))draft.aquecimento.push({exercicio:'',duracao_minutos:3});}if(a==='add-cardio')draft.cardio_final={tipo:'Passadeira',tempo_total_minutos:10,etapas:[]};if(a==='remove-cardio')delete draft.cardio_final;if(a==='add-stage'){draft.cardio_final.etapas??=[];draft.cardio_final.etapas.push({duracao_minutos:5,velocidade_kmh:6});}if(a==='add-set'){const sets=getAt(draft,p);const previous=sets.at(-1)||{};sets.push({serie:sets.length+1,repeticoes:previous.repeticoes??10,carga_kg:previous.carga_kg});}if(a==='remove-set'){const sets=getAt(draft,p.slice(0,-1));sets.splice(p.at(-1),1);sets.forEach((set,i)=>set.serie=i+1);}const scroll=$('#modal').scrollTop;editor();$('#modal').scrollTop=scroll;}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,p=btn.dataset.path?JSON.parse(btn.dataset.path):null,r=current();if(a==='close')return closeModal();if(a==='new')return startEditor();if(a==='evolution'){view='evolution';render();return;}if(a==='edit')return startEditor(active);if(a==='select'){view='workout';active=btn.dataset.id;return render();}if(a==='import')return importDialog();if(a==='import-tab')return importDialog(btn.dataset.mode);if(a==='choose-file')return $('#file-input').click();if(a==='parse-json'){try{addImported(Core.parse($('#json-input').value));}catch(err){$('#import-error').textContent=err.message;}return;}if(a==='print-pdf'){const oldTitle=document.title;document.title='Atlas - '+Core.title(r.treino);document.body.classList.add('printing-plan');window.addEventListener('afterprint',()=>{document.title=oldTitle;document.body.classList.remove('printing-plan');},{once:true});window.print();return;}if(a==='export')return exportDialog();if(a==='export-current'){download({treino:r.treino},'atlas-treino.json');return closeModal();}if(a==='export-all'){download({versao:1,treinos:records.map(r=>({treino:r.treino}))},'atlas-treinos.json');return closeModal();}if(a==='delete')return modal('Eliminar este treino?',`<p class="muted">“${esc(Core.title(r.treino))}” será removido deste dispositivo. Esta ação não pode ser desfeita.</p><div class="modal-foot"><button data-action="close">Cancelar</button><button class="danger" data-action="confirm-delete">Eliminar treino</button></div>`);if(a==='confirm-delete'){records=records.filter(x=>x.id!==active);for(const k of timers.keys())if(k.startsWith(active+':'))timers.delete(k);active=records[0]?.id||'';persist();closeModal();render();return;}if(draft&&['add-block','add-ex','add-super','remove-ex','remove-block','add-warmup','add-cardio','remove-cardio','add-stage','add-set','remove-set'].includes(a))return editAction(a,p);if(a==='check'){r.done[pathKey(p)]=!r.done[pathKey(p)];persist();return render();}if(a==='round-plus'||a==='round-minus'){const x=getAt(r.treino,p);x.rondas_completadas=Math.max(0,(Core.number(x.rondas_completadas)||0)+(a==='round-plus'?1:-1));persist();return render();}if(a==='timer'||a==='reset'){const b=Core.blocks(r.treino).find(b=>pathKey(b.path)===pathKey(p)),s=timerState(b);if(a==='reset'){s.running=false;s.remaining=(Core.number(b.data.duracao_minutos)||0)*60;}else{s.running=!s.running;if(s.running)s.end=Date.now()+s.remaining*1000;else s.remaining=Math.max(0,Math.ceil((s.end-Date.now())/1000));}render();}});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;if(action==='suggest'){view='suggestion';render();}if(action==='add-local-suggestion'&&localSuggestion){const rec={id:uid(),treino:clone(localSuggestion),done:{}};records.push(rec);active=rec.id;view='workout';persist();render();notify('Sugestão adicionada ao teu plano.');}if(action==='edit-local-suggestion'&&localSuggestion){editingId=null;draft=clone(localSuggestion);editor();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;renderHistory();}if(e.target.id==='session-notes'){current().treino.notas=e.target.value;persist();}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;renderHistory();}if(e.target.id==='evolution-exercise'){evolutionExercise=e.target.value;evolutionMetric='';render();}if(e.target.id==='evolution-period'){evolutionPeriod=e.target.value;evolutionMetric='';render();}if(e.target.id==='evolution-metric'){evolutionMetric=e.target.value;render();}if(e.target.id==='file-input')readFiles(e.target.files);});
document.addEventListener('submit',e=>{if(e.target.id!=='suggestion-form')return;e.preventDefault();const form=new FormData(e.target),params=Object.fromEntries(form.entries());try{localSuggestion=buildLocalSuggestion(params);render();notify('Sugestão criada localmente.');}catch(err){notify(err.message);}});
document.addEventListener('submit',e=>{if(e.target.id!=='workout-form')return;e.preventDefault();syncDraft();try{Core.validate(draft);for(const {x} of Core.leaves(draft))if(!String(x.nome||x.exercicio||'').trim())throw Error('Preenche o nome de cada exercício.');const rec={id:editingId||uid(),treino:draft,done:{}};if(editingId){const i=records.findIndex(x=>x.id===editingId);records[i]=rec;for(const k of timers.keys())if(k.startsWith(editingId+':'))timers.delete(k);}else records.push(rec);active=rec.id;persist();closeModal();render();notify('Treino guardado.');}catch(err){$('#edit-error').textContent=err.message;}});
document.addEventListener('dragover',e=>{const z=e.target.closest('#dropzone');if(z){e.preventDefault();z.classList.add('drag');}});document.addEventListener('dragleave',e=>{e.target.closest('#dropzone')?.classList.remove('drag');});document.addEventListener('drop',e=>{const z=e.target.closest('#dropzone');if(z){e.preventDefault();z.classList.remove('drag');readFiles(e.dataTransfer.files);}});
$('#modal').addEventListener('cancel',()=>draft=null);
setInterval(()=>{let finished=false;for(const [key,s] of timers){if(!s.running)continue;s.remaining=Math.max(0,Math.ceil((s.end-Date.now())/1000));if(!s.remaining){s.running=false;finished=true;notify('Tempo terminado. Regista as tuas rondas!');}if(key.startsWith(active+':'))document.querySelectorAll('[data-clock]').forEach(el=>{if(timerKey(JSON.parse(el.dataset.clock))===key)el.textContent=timeString(s.remaining);});}if(finished)render();},250);
function suggestionRecords(){const personal=records.filter(r=>!r.demo);return personal.length?personal:records;}
function localTrainingAnalysis(){const dated=suggestionRecords().map((r,i)=>({r,i,date:evolutionDate(r.treino)})).filter(x=>x.date).sort((a,b)=>b.date.localeCompare(a.date)||b.i-a.i),recent=dated.slice(0,8),counts={lower:0,push:0,pull:0,full:0},last={};for(const x of recent){const f=workoutFocus(x.r.treino);counts[f]++;last[f]??=x.date;}const previous=recent[0]?workoutFocus(recent[0].r.treino):'',choices=['lower','push','pull','full'].sort((a,b)=>counts[a]-counts[b]||((a===previous)-(b===previous)));return{recent,counts,last,previous,recommended:choices[0]};}
function lastExercisePrescription(name){const key=exerciseKey(name),dated=suggestionRecords().map((r,i)=>({r,i,date:evolutionDate(r.treino)})).filter(x=>x.date).sort((a,b)=>b.date.localeCompare(a.date)||b.i-a.i);for(const {r} of dated)for(const {x} of Core.leaves(r.treino))if(exerciseKey(x.nome||x.exercicio)===key){const sets=Array.isArray(x.series)?x.series:[x],loads=sets.map(s=>Core.number(s.carga_kg)).filter(n=>n!==null),per=sets.map(s=>Core.number(s.carga_kg_por_halter)).filter(n=>n!==null);return{load:loads.length?Math.max(...loads):null,per:per.length?Math.max(...per):null};}return{load:null,per:null};}
function recentExercisesForFocus(focus){const seen=new Set(),out=[],dated=suggestionRecords().map((r,i)=>({r,i,date:evolutionDate(r.treino)})).filter(x=>x.date).sort((a,b)=>b.date.localeCompare(a.date)||b.i-a.i);for(const {r} of dated)for(const {x} of Core.leaves(r.treino)){const name=x.nome||x.exercicio,key=exerciseKey(name);if(name&&focusOfExercise(name)===focus&&!seen.has(key)){seen.add(key);out.push(name);}}return out;}
// A pré-visualização omite métricas que não se aplicam a exercícios de tempo ou AMRAP.
function suggestionExerciseHTML(x){const parts=[];if(x.series!==undefined)parts.push(`<span><strong>${esc(x.series)}</strong> séries</span>`);if(x.repeticoes!==undefined)parts.push(`<span><strong>${esc(x.repeticoes)}</strong> reps</span>`);if(x.duracao_segundos!==undefined)parts.push(`<span><strong>${esc(x.duracao_segundos)}</strong> s</span>`);if(x.carga_kg)parts.push(`<span><strong>${fmt(x.carga_kg)}</strong> kg</span>`);if(x.carga_kg_por_halter)parts.push(`<span><strong>${fmt(x.carga_kg_por_halter)}</strong> kg / halter</span>`);if(x.descanso_segundos!==undefined)parts.push(`<span>${esc(x.descanso_segundos)} s descanso</span>`);return`<div class="suggestion-exercise"><div><strong>${esc(x.nome)}</strong><div class="metrics">${parts.join('')}</div>${x.notas?`<p class="note">${esc(x.notas)}</p>`:''}</div></div>`;}
// A declaração final substitui a primeira versão do gerador e mantém o plano inteiramente local.
function buildLocalSuggestion(params){
 const analysis=localTrainingAnalysis(),focus=params.focus==='auto'?analysis.recommended:params.focus;
 const duration=Number(params.duration),equipment=params.equipment==='all'?'gym':params.equipment;
 const intensity=params.intensity,goal=params.goal,avoid=String(params.avoid||'').split(',').map(exerciseKey).filter(Boolean);
 let names=[];
 if(params.equipment==='all')names.push(...recentExercisesForFocus(focus).slice(0,2));
 names.push(...EXERCISE_BANK[focus][equipment].map(x=>x[0]));
 names=[...new Set(names)].filter(name=>!avoid.some(term=>exerciseKey(name).includes(term)));
 const wanted=duration<=30?3:duration<=45?4:5;
 if(names.length<wanted)throw Error('As exclusões retiraram demasiados exercícios. Reduz a lista de exercícios a evitar.');
 names=names.slice(0,wanted);
 let sets=intensity==='leve'?2:intensity==='alta'?4:3,reps=intensity==='alta'?8:10,rest=intensity==='leve'?75:intensity==='alta'?120:90;
 if(goal==='forca'){sets+=1;reps=6;rest=120;}if(goal==='resistencia'){reps=12;rest=60;}if(goal==='perda'){reps=10;rest=75;}
 const exercises=names.map(name=>{const previous=lastExercisePrescription(name),x={nome:name,series:sets,repeticoes:reps,descanso_segundos:rest};if(previous.load)x.carga_kg=previous.load;if(previous.per)x.carga_kg_por_halter=previous.per;if(previous.load||previous.per)x.notas='Carga recuperada do último plano. Ajusta se a técnica ou a recuperação o exigirem.';return x;});
 const goalLabel={equilibrio:'Equilíbrio semanal',forca:'Força',resistencia:'Resistência muscular',perda:'Condicionamento e perda de peso'}[goal];
 const intensityLabel={leve:'Leve',moderada:'Moderada',alta:'Alta'}[intensity];
 const blocks=[{bloco:1,tipo:goal==='forca'?'Força':'Força / Acessórios',exercicios:exercises}];
 if(duration>=45&&goal!=='forca')blocks.push({bloco:2,tipo:'AMRAP',duracao_minutos:duration>=60?12:8,rondas_completadas:0,exercicios:[{ordem:1,nome:equipment==='body'?'Mountain Climbers':'Dumbbell Thrusters',repeticoes:12},{ordem:2,nome:'Burpees',repeticoes:intensity==='leve'?6:10},{ordem:3,nome:'Prancha Frontal',duracao_segundos:intensity==='alta'?45:30}]});
 const reason=analysis.recent.length?`O histórico recente tem ${analysis.counts[focus]} sessão(ões) com este foco. O último treino foi ${analysis.previous?FOCUS_LABEL[analysis.previous].toLowerCase():'sem foco definido'}, por isso o motor propõe ${FOCUS_LABEL[focus].toLowerCase()} para melhorar a rotação.`:'Ainda não existe histórico suficiente; foi criado um plano equilibrado para começar.';
 return{data:new Date().toLocaleDateString('sv-SE'),foco:`Sugestão · ${FOCUS_LABEL[focus]}`,objetivo:`${goalLabel} · intensidade ${intensityLabel.toLowerCase()}`,duracao_total_minutos:duration,categoria:blocks.length>1?'Misto':'Força',aquecimento:[{exercicio:'Cardio leve',duracao_minutos:4},{exercicio:'Mobilidade dinâmica',duracao_minutos:4}],blocos_principais:blocks,notas:'Sugestão criada localmente a partir do histórico. Revê cargas, técnica e recuperação antes de começar.',_atlas_sugestao_local:{focus,reason,params}};
}
// Ferramentas opcionais para navegadores com suporte a WebMCP.
if(navigator.modelContext?.registerTool){
 try{navigator.modelContext.registerTool({name:'atlas_list_workouts',description:'Listar os planos de treino guardados localmente no Atlas.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:async()=>({content:[{type:'text',text:JSON.stringify(records.map(r=>({id:r.id,treino:r.treino})))}]})});}catch{}
}
render();if(storageError)notify(storageError);
</script><script src="supabase-config.js"></script><script src="cloud.js"></script></body></html>
